{{- /* Inline, render-blocking theme bootstrap — avoids a flash of the wrong
       colour scheme. Ported from `ThemeProvider.astro`. */ -}}
<script>
  ;(function () {
    function simpleSetTheme() {
      var theme = localStorage.getItem('theme')
      if (!theme || theme === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      }
      document.documentElement.classList.toggle('dark', theme === 'dark')
      var meta = document.querySelector('meta[name="theme-color"]')
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#0B0B10' : '#FCFCFD')
    }
    window.__pureSetTheme = simpleSetTheme
    simpleSetTheme()
  })()
</script>
